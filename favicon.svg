<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Glowing futuristic 'M' + Growth Arrow Icon -->
  <g filter="url(#neonGlow)">
    <!-- Left Pillar -->
    <path d="M15 47 L15 22 C15 19.8 16.8 18 19 18 C20.2 18 21.3 18.5 22 19.4 L32 31.5 L42 19.4 C42.7 18.5 43.8 18 45 18 C47.2 18 49 19.8 49 22 L49 47" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Upward Trend Diamond / Shutter Aperture Spark -->
    <polygon points="32,15 36,20 32,25 28,20" fill="#38bdf8"/>
    
    <!-- Growth Indicator Arrow on right -->
    <circle cx="49" cy="20" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
